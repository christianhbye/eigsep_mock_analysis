[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eigsep-pointing-sim"
version = "0.0.1"
description = "Pure NumPy pointing and observation-window injections for EIGSEP"
requires-python = ">=3.11"
dependencies = ["numpy"]

[tool.hatch.build.targets.wheel]
packages = ["src/eigsep_pointing_sim"]
