[project]
name = "eigsep-mock-analysis"
version = "0.0.0"
description = "Simulation and analysis workspace for the EIGSEP experiment"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["eigsim", "rotis", "pointing_sim"]
# models_21cm is a standalone project, not a member: it depends on classy,
# which compiles CLASS from source and has no place in the workspace lock
# or in CI. Run it with `uv run --project models_21cm ...`.
# These analyses have separate environments; keep their locks isolated.
# C54 S11 uses analysis JAX0.10.2; the mock workspace stays on0.9.2.
exclude = ["models_21cm", "fine_night_d5", "s11_hypotheses"]

[tool.uv.sources]
eigsim = { workspace = true }
rotis = { workspace = true }
eigsep-pointing-sim = { workspace = true }

[dependency-groups]
dev = [
    "eigsim",
    "eigsep-pointing-sim",
    "jupyter",
    "matplotlib",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "rotis",
    "ruff",
]

[tool.ruff]
line-length = 88
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["eigsim/tests", "rotis/tests", "pointing_sim/tests", "horizon_position_d5/tests"]
pythonpath = ["."]
# eigsim/tests and rotis/tests are both Python packages named tests.
addopts = "--import-mode=importlib"
