name: eigsim tests

on:
  push:
    branches: [main]
    paths:
      - "eigsim/**"
  pull_request:
    branches: [main]
    paths:
      - "eigsim/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen --dev
      - run: uv run pytest eigsim/tests -v --cov=eigsim --cov-report=xml:eigsim-coverage.xml
      - uses: codecov/codecov-action@v5
        if: always()
        with:
          files: eigsim-coverage.xml
          flags: eigsim
          token: ${{ secrets.CODECOV_TOKEN }}
