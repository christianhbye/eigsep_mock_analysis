name: eigsim tests

on:
  push:
    branches: [main]
    paths:
      - "eigsim/**"
      - "horizon_position_d5/**"
  pull_request:
    branches: [main]
    paths:
      - "eigsim/**"
      - "horizon_position_d5/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen --dev
      - run: uv run python -m pytest eigsim/tests horizon_position_d5/tests -v --cov=eigsim --cov-report=xml:eigsim-coverage.xml
      - uses: codecov/codecov-action@v5
        if: always()
        with:
          files: eigsim-coverage.xml
          flags: eigsim
          token: ${{ secrets.CODECOV_TOKEN }}
