[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eigsim"
version = "0.2.0"
description = "Simulation code for the EIGSEP experiment"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "croissant-sim @ git+https://github.com/christianhbye/croissant.git@v5.3.0.dev3",
    "s2fft @ git+https://github.com/slosar/s2fft.git@cefdf468ec2540818bafb37ed60d7b1fbba2f21f",
    "numpy",
    "pygdsm",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.hatch.metadata]
# croissant-sim and its s2fft fork are pinned by git URL while
# croissant is off PyPI.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/eigsim"]
