# EIGSEP experiment configuration
# Single source of truth for experiment-specific parameters.
# Override individual fields by passing a custom YAML to load_config().
# Packaged alternatives, loaded by name with load_config("<name>"):
#   eigsep_1mhz       the same beam, interpolated to a 1 MHz grid
#   eigsep_v001       frozen v001 beam and grid (frequency labels one step low)
#   eigsep_v001_1mhz  frozen v001 on its 1 MHz grid
#   eigsep_v000       the older beam and grid, for reproducing earlier studies

world: earth

location:
  lon: -113.4033
  lat: 39.2477
  alt: 0.0    # meters

# The 52 frequencies the HFSS beam was simulated at, from the native export:
# k * 3.90625 MHz for k = 13..64, i.e. 50.78125-250.0 MHz. On the D5 grid
# f = c * 250 / 1024 these are channels c = 208, 224, ..., 1024 (1024 is
# Nyquist, one past the last correlator channel).
frequencies: {start: 50.78125, stop: 253.90625, step: 3.90625}  # MHz

ground:
  temperature: 300.0  # K

receiver:
  temperature: 50.0   # K

beam:
  sampling: mwss
  file: eigsep_bowtie_v002_mwss.npz

horizon:
  file: horizon_mwss.npz

sky:
  model: gsm16
  resolution: lo
  include_cmb: true

orientations:
  elevations: {start: 0, stop: 360, step: 10}   # degrees
  azimuths:   {start: 0, stop: 360, step: 10}   # degrees
