# FROZEN: the v001 beam and grid, for reproducing studies made with it.
# v001's frequency labels are one 3.90625 MHz step low: the beam it calls
# 46.875 MHz is the 50.78 MHz beam (confirmed by Dominic, 2026-09-16), so
# every beam here sits at the wrong frequency. Use eigsep (v002) for new work.
# Do not change this file.
# EIGSEP experiment configuration
# Single source of truth for experiment-specific parameters.
# Override individual fields by passing a custom YAML to load_config().
# Packaged alternatives, loaded by name with load_config("<name>"):
#   eigsep_1mhz  the same beam, interpolated to a 1 MHz grid
#   eigsep_v000  the previous beam and grid, for reproducing earlier studies

world: earth

location:
  lon: -113.4033
  lat: 39.2477
  alt: 0.0    # meters

# The 52 D5 correlator channels the HFSS beam was simulated at:
# k = 192, 208, ..., 1008 on f_k = k * 250 / 1024 MHz.
frequencies: {start: 46.875, stop: 250.0, step: 3.90625}  # MHz

ground:
  temperature: 300.0  # K

receiver:
  temperature: 50.0   # K

beam:
  sampling: mwss
  file: eigsep_bowtie_v001_mwss.npz

horizon:
  file: horizon_mwss.npz

sky:
  model: gsm16
  resolution: lo
  include_cmb: true

orientations:
  elevations: {start: 0, stop: 360, step: 10}   # degrees
  azimuths:   {start: 0, stop: 360, step: 10}   # degrees
